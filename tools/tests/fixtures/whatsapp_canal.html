<!doctype html>
<!--
  FIXTURE SINTETICA do WhatsApp Web (BSV-63). NAO e gravacao do WhatsApp real: foi montada com as ancoras que o
  publicador usa (pub/canal_web.py) para testar o fluxo em um Chromium de verdade. Ao gravar o DOM real na inst2
  (python main.py --gravar-dom), conferir cada ancora abaixo contra o arquivo e trocar esta fixture pela gravada
  e redigida. Comportamentos simulados (os que importam para os criterios de aceite):
    - Enter sem Shift no editor ENVIA a mensagem (como no WhatsApp); Shift+Enter quebra a linha;
    - colar (evento paste com text/plain) vira um <p> por linha, linha vazia = <p><br></p> (como o Lexical);
    - enviar cria o balao com o relogio de pendente (msg-time) e troca por msg-check em 200 ms,
      a menos que window.__redeCaida seja true;
    - #qr na URL mostra o QR no lugar da lista de conversas.
-->
<html lang="pt-BR">
<head><meta charset="utf-8"><title>WhatsApp</title>
<style>
  body { font-family: sans-serif; margin: 0; }
  #side { width: 300px; float: left; }
  #main { margin-left: 310px; }
  .oculto { display: none !important; }
  [contenteditable] { border: 1px solid #999; min-height: 20px; white-space: pre-wrap; }
  #previa { position: fixed; inset: 40px; background: #eee; }
</style>
</head>
<body>
<div id="app">
  <div id="qrbox" class="oculto"><div data-ref="2@REDACTED"><canvas aria-label="Scan this QR code to link a device!" width="264" height="264"></canvas></div></div>
  <div id="logado">
    <header><span role="button" aria-label="Canais" data-icon="newsletter-outline" id="aba-canais">Canais</span></header>
    <div id="side">
      <div><input role="textbox" aria-label="Pesquisar ou começar uma nova conversa" type="text"></div>
      <div id="pane-side">
        <div role="listitem"><span title="Grupo qualquer" dir="auto">Grupo qualquer</span></div>
      </div>
      <div id="lista-canais" class="oculto">
        <div role="listitem"><span title="BeSave - Preços Baixos e Ofertas incríveis" dir="auto">BeSave - Preços Baixos e Ofertas incríveis</span></div>
      </div>
    </div>
    <div id="main" class="oculto">
      <header><span dir="auto">BeSave - Preços Baixos e Ofertas incríveis</span></header>
      <div id="mensagens"></div>
      <footer>
        <span role="button" aria-label="Anexar"><span data-icon="plus-rounded">+</span></span>
        <div contenteditable="true" role="textbox" aria-label="Digite uma atualização" data-tab="10"></div>
        <div id="menu-anexo" class="oculto"><input type="file" accept="image/*,video/mp4,video/3gpp,video/quicktime"></div>
      </footer>
    </div>
  </div>
  <div id="previa" class="oculto" role="dialog">
    <img id="foto-previa" alt="">
    <div id="legenda" contenteditable="true" role="textbox" aria-label="Adicionar legenda" data-lexical-editor="true"></div>
    <span role="button" aria-label="Enviar"><span data-icon="send">&gt;</span></span>
  </div>
</div>
<script>
  const $ = (s) => document.querySelector(s);
  window.__envios = [];
  window.__enters = 0;
  if (location.hash === '#qr') { $('#qrbox').classList.remove('oculto'); $('#logado').classList.add('oculto'); }
  $('#aba-canais').onclick = () => { $('#pane-side').classList.add('oculto'); $('#lista-canais').classList.remove('oculto'); };
  document.querySelectorAll('span[title]').forEach(s => s.onclick = () => {
    if (s.title.startsWith('BeSave')) $('#main').classList.remove('oculto');
  });
  $('footer [aria-label="Anexar"]').onclick = () => $('#menu-anexo').classList.remove('oculto');
  $('#menu-anexo input').onchange = (e) => {
    if (e.target.files.length) { $('#previa').classList.remove('oculto'); $('#legenda').innerHTML = ''; }
  };
  // texto como o WhatsApp enviaria: <p> = linha, <br> = quebra
  function textoEditor(el) {
    const txt = (n) => { let s = ''; n.childNodes.forEach(c => {
      if (c.nodeType === 3) s += c.data; else if (c.nodeName === 'BR') s += '\n'; else s += txt(c); }); return s; };
    const bloco = (n) => { const s = txt(n); return s.endsWith('\n') ? s.slice(0, -1) : s; };
    const ps = Array.from(el.children).filter(c => c.nodeName === 'P' || c.nodeName === 'DIV');
    return ps.length ? ps.map(bloco).join('\n') : bloco(el);
  }
  function enviar() {
    const texto = textoEditor($('#legenda'));
    window.__envios.push(texto);
    const row = document.createElement('div');
    row.setAttribute('role', 'row');
    row.innerHTML = '<div class="bolha"><span class="texto"></span><span data-icon="msg-time"></span></div>';
    row.querySelector('.texto').textContent = texto.replace(/[*_~`]/g, '');
    $('#mensagens').appendChild(row);
    $('#legenda').innerHTML = '';
    $('#previa').classList.add('oculto');
    if (!window.__redeCaida) setTimeout(() => row.querySelector('[data-icon]').setAttribute('data-icon', 'msg-check'), 200);
  }
  $('#previa [aria-label="Enviar"]').onclick = enviar;
  $('#legenda').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); window.__enters++; enviar(); }
    else if (e.key === 'Enter' && e.shiftKey) { e.preventDefault(); document.execCommand('insertLineBreak'); }
  });
  $('#legenda').addEventListener('paste', (e) => {
    e.preventDefault();
    const texto = e.clipboardData.getData('text/plain');
    const el = $('#legenda');
    el.innerHTML = '';
    texto.split('\n').forEach(l => { const p = document.createElement('p');
      if (l) p.textContent = l; else p.appendChild(document.createElement('br')); el.appendChild(p); });
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('#previa').classList.add('oculto'); });
</script>
</body>
</html>
