[package]
name = "besave-worker"
version = "0.1.0"
edition = "2024"
publish = false
description = "Oracle → contrato Besave (CONTRATO.md, MANIFEST.md)"

[lib]
name = "worker"
path = "src/lib.rs"

[[bin]]
name = "besave-worker"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
tracing = "0.1.44"
unicode-normalization = "0.1.25"
