[package]
name = "besave-worker"
version = "0.1.0"
edition = "2024"
publish = false
description = "Oracle → contrato Besave (CONTRATO.md, MANIFEST.md)"

[lib]
name = "worker"
path = "src/lib.rs"

[[bin]]
name = "besave-worker"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
aws-config = { version = "1.12.0", features = ["behavior-version-latest"] }
aws-sdk-cloudfrontkeyvaluestore = { version = "1.111.0", default-features = false, features = ["default-https-client", "rt-tokio", "sigv4a"] }
aws-sdk-s3 = { version = "1.149.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
brotli = "9.0.0"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
# `--env-file` (BSV-14): não sobrescreve variável já definida.
dotenvy = "0.15.7"
hex = "0.4.3"
# Cliente HTTPS do Telegram (BSV-14): as mesmas crates que o SDK AWS já compila; nenhum pacote novo no lock.
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", default-features = false, features = ["client", "http1"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["aws-lc-rs", "http1", "native-tokio", "tls12"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["client-legacy", "http1", "tokio"] }
minijinja = { version = "2.24.0", default-features = false, features = ["builtins", "json", "serde"] }
# `jpeg` (BSV-40): a foto do canal é JPEG 800×800 (`sendPhoto`); puro Rust (`zune-jpeg`), sem libjpeg.
image = { version = "0.25.10", default-features = false, features = ["webp", "jpeg"] }
oracle = "0.6.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", default-features = false, features = ["rt", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.25"

[dev-dependencies]
jsonschema = { version = "0.58.0", default-features = false }
roxmltree = "0.21.1"

# Brotli 9 e SHA-256 sem otimização dobram o tempo do teste de 30k cards (≤ 30 s, `--ignored`).
[profile.dev.package.brotli]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

# Foto 800×800 do canal (BSV-40): redimensionar e codificar JPEG sem otimização leva segundos por
# foto; o dia simulado do envio gera 180.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3
